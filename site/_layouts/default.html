<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title and page.title != "CopyDrawer" %}{{ page.title }}{% else %}CopyDrawer – Clipboard History for Chrome{% endif %}</title>
    <meta name="description" content="Everything you copy, kept and sorted. A private clipboard history for Chrome: your clips stay on your computer.">
    <link rel="icon" href="{{ '/assets/icon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="icon" href="{{ '/assets/icon-32.png' | relative_url }}" sizes="32x32">
    <link rel="stylesheet" href="{{ '/assets/site.css?v=' | append: site.github.build_revision | relative_url }}">
  </head>
  <body>
    <header>
      <div class="wrap">
        <a class="brand" href="{{ '/' | relative_url }}"><img src="{{ '/assets/icon.svg' | relative_url }}" alt="">CopyDrawer</a>
        <nav><a href="{{ '/privacy' | relative_url }}"{% if page.url == "/privacy" %} aria-current="page"{% endif %}>Privacy</a></nav>
      </div>
    </header>
    <main>
      <div class="wrap">
        {{ content }}
      </div>
    </main>
    <footer>
      <div class="wrap">
        <span>© {{ site.time | date: "%Y" }} Marcus Leung</span>
        <a href="mailto:leungmarcus89@gmail.com">leungmarcus89@gmail.com</a>
      </div>
    </footer>
  </body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dropping images into the side panel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 400px; height: 860px; box-sizing: border-box; background: #FFFFFF; color: #1B1D2A; font-family: 'Instrument Sans', sans-serif; position: relative; overflow: hidden">
  <div aria-hidden="true" style="padding: 20px 18px; opacity: 0.35">
    <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px">Your clips</div>
    <div style="margin-top: 20px; height: 44px; border-radius: 22px; background: #F1F2F6"></div>
    <div style="margin-top: 20px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <span style="height: 76px; border-radius: 4px 12px 12px 12px; background: #E6EEFC"></span>
      <span style="height: 76px; border-radius: 4px 12px 12px 12px; background: #FCEBD9"></span>
      <span style="height: 76px; border-radius: 4px 12px 12px 12px; background: #EEE8FB"></span>
      <span style="height: 76px; border-radius: 4px 12px 12px 12px; background: #DDF3EC"></span>
    </div>
  </div>

  <div style="position: absolute; left: 14px; top: 14px; right: 14px; height: 560px; border: 3px dashed #2457C5; border-radius: 22px; background: rgba(230,238,252,0.92); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 24px; box-sizing: border-box">
    <div aria-hidden="true" style="position: relative; width: 120px; height: 90px">
      <span style="position: absolute; left: 0; top: 10px; width: 84px; height: 64px; border-radius: 10px; background: #FFFFFF; box-shadow: 0 6px 16px rgba(27,29,42,0.15); transform: rotate(-8deg)"></span>
      <span style="position: absolute; left: 32px; top: 0; width: 84px; height: 64px; border-radius: 10px; background: #FFFFFF; box-shadow: 0 6px 16px rgba(27,29,42,0.15); transform: rotate(6deg); display: flex; align-items: center; justify-content: center"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#2457C5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-8 9"></path></svg></span>
    </div>
    <p style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px; color: #173D8F">Drop to save 2 images</p>
    <p style="margin: 0; font-size: 14px; line-height: 20px; color: #173D8F">They'll be filed into a collection for you. PNG, JPG, GIF and WebP up to 20 MB each.</p>
  </div>

  <section aria-labelledby="dz-up" style="position: absolute; left: 14px; right: 14px; top: 594px; background: #FFFFFF; border: 1px solid #E3E5EC; border-radius: 16px; padding: 12px 14px">
    <h2 id="dz-up" style="margin: 0 0 10px; font-size: 13px; font-weight: 600; color: #555A6E">Saving</h2>
    <div style="display: flex; align-items: center; gap: 12px; padding: 6px 0">
      <span style="width: 44px; height: 34px; border-radius: 8px; background: repeating-linear-gradient(135deg, #F1F2F6 0 8px, #E5E7EE 8px 16px); flex-shrink: 0"></span>
      <span style="flex: 1; min-width: 0"><span style="display: block; font-size: 13px; font-weight: 600">lab-results.png</span><span style="display: block; margin-top: 6px; height: 4px; border-radius: 2px; background: #ECEDF2"><span style="display: block; width: 70%; height: 4px; border-radius: 2px; background: #2457C5"></span></span></span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 6px 0">
      <span style="width: 44px; height: 34px; border-radius: 8px; background: repeating-linear-gradient(135deg, #F1F2F6 0 8px, #E5E7EE 8px 16px); flex-shrink: 0"></span>
      <span style="flex: 1; min-width: 0"><span style="display: block; font-size: 13px; font-weight: 600">moodboard-03.jpg</span><span style="display: block; margin-top: 2px; font-size: 12px; color: #0B5C4A">Saved to Design</span></span>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trip collection: Lisbon</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5E5100}a:hover{color:#4D4200}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 400px; height: 860px; box-sizing: border-box; background: #FFFFFF; color: #1B1D2A; font-family: 'Instrument Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="background: #F6F0D5; border-top: 6px solid #7C6A0A; padding: 10px 14px 18px">
    <button aria-label="Back to home" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; color: #1B1D2A; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
    <h1 style="margin: 6px 4px 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px">Lisbon trip</h1>
    <p style="margin: 4px 4px 0; font-size: 14px; color: #5C4F12">14 – 18 Oct. 9 clips</p>
  </div>

  <ul style="list-style: none; margin: 0; padding: 6px 18px 0; flex: 1; overflow: hidden">
    <sc-for list="{{clips}}" as="c" hint-placeholder-count="7">
      <li style="display: flex; align-items: center; gap: 12px; min-height: 64px; border-bottom: 1px solid #ECEDF2">
        <span style="flex: 1; min-width: 0">
          <span style="display: block; font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{c.title}}</span>
          <span style="display: block; margin-top: 2px; font-size: 13px; color: #555A6E">{{c.meta}}</span>
        </span>
        <a href="#" style="height: 36px; padding: 0 12px; border-radius: 18px; background: #F1F2F6; color: #1B1D2A; font-size: 13px; font-weight: 600; text-decoration: none; display: flex; align-items: center; flex-shrink: 0">{{c.action}}</a>
      </li>
    </sc-for>
  </ul>

  <div style="padding: 12px 18px 18px">
    <button style="width: 100%; height: 52px; border: 0; border-radius: 26px; background: #1B1D2A; color: #FFFFFF; font-size: 15px; font-weight: 600; cursor: pointer">Share the plan</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
  renderVals() {
    return { clips: [
      { title: 'Flight TP 1355 to Lisbon', meta: 'Tue 14 Oct, 07:40', action: 'Calendar' },
      { title: 'Chiado studio', meta: '€84 a night', action: 'Open' },
      { title: 'Alfama loft', meta: '€96 a night', action: 'Open' },
      { title: 'Time Out Market', meta: 'Food', action: 'Map' },
      { title: 'Belém Tower', meta: 'Opens 10:00', action: 'Map' },
      { title: 'Fado show, Clube de Fado', meta: 'Sat 18 Oct, 21:00', action: 'Calendar' },
      { title: 'Tram 28 route', meta: 'Things to do', action: 'Map' }
    ] };
  }
}
</script>
</body>
</html>

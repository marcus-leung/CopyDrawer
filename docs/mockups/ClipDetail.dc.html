<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Text clip detail with smart actions</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2457C5}a:hover{color:#173D8F}
button,select,textarea{font-family:inherit}
</style>
</helmet>
<div style="width: 400px; height: 860px; box-sizing: border-box; background: #FFFFFF; color: #1B1D2A; font-family: 'Instrument Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 14px 14px 8px; display: flex; align-items: center; justify-content: space-between">
    <button aria-label="Back" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; color: #1B1D2A; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
    <div style="display: flex; gap: 6px">
      <button aria-label="Pin" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #F1F2F6; color: #1B1D2A; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5M9 3h6l-1 6 4 4H6l4-4z"></path></svg></button>
      <button aria-label="Delete" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #F1F2F6; color: #B42318; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg></button>
    </div>
  </header>

  <div style="padding: 0 18px">
    <p style="margin: 0; font-size: 13px; font-weight: 600; color: #0B5C4A; display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #0E7A62"></span>Shopping</p>
    <h1 style="margin: 6px 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px">Tracking number for running shoes</h1>
    <p style="margin: 4px 0 0; font-size: 13px; color: #555A6E">Copied from <a href="#">mail.google.com</a> yesterday at 6:02 PM</p>

    <label for="clip-text" style="display: block; margin-top: 16px; font-size: 13px; font-weight: 600; color: #555A6E">Clip</label>
    <textarea id="clip-text" rows="2" style="margin-top: 6px; width: 100%; box-sizing: border-box; border: 1px solid #DADCE5; border-radius: 14px; padding: 12px 14px; font-size: 16px; font-weight: 600; letter-spacing: 0.04em; color: #1B1D2A; resize: none; background: #FFFFFF">1Z 999 AA1 01 2345 6784</textarea>
  </div>

  <section aria-labelledby="cd-smart" style="margin: 16px 14px 0; padding: 14px 16px; border-radius: 16px; background: #DDF3EC">
    <h2 id="cd-smart" style="margin: 0; font-size: 14px; font-weight: 600; color: #0B5C4A">Looks like a UPS tracking number</h2>
    <div style="display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap">
      <a href="#" style="height: 40px; padding: 0 16px; border-radius: 20px; background: #0E7A62; color: #FFFFFF; font-size: 13px; font-weight: 600; text-decoration: none; display: flex; align-items: center">Track package</a>
      <button style="height: 40px; padding: 0 14px; border: 0; border-radius: 20px; background: #FFFFFF; color: #0B5C4A; font-size: 13px; font-weight: 600; cursor: pointer">Copy without spaces</button>
    </div>
  </section>

  <div style="padding: 16px 18px 0; display: flex; flex-direction: column; gap: 8px">
    <button style="height: 50px; border: 0; border-radius: 25px; background: #1B1D2A; color: #FFFFFF; font-size: 15px; font-weight: 600; cursor: pointer">Paste</button>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button style="height: 46px; border: 0; border-radius: 23px; background: #F1F2F6; color: #1B1D2A; font-size: 14px; font-weight: 600; cursor: pointer">Paste as…</button>
      <button style="height: 46px; border: 0; border-radius: 23px; background: #F1F2F6; color: #1B1D2A; font-size: 14px; font-weight: 600; cursor: pointer">Add to research</button>
    </div>
  </div>

  <div style="padding: 16px 18px 0; display: flex; align-items: center; gap: 10px">
    <label for="cd-col" style="font-size: 13px; color: #3E4357">Move to</label>
    <select id="cd-col" style="height: 36px; border: 1px solid #DADCE5; border-radius: 18px; padding: 0 12px; font-size: 13px; font-weight: 600; color: #0B5C4A; background: #DDF3EC">
      <option>Shopping</option><option>Research</option><option>Links</option>
    </select>
  </div>

  <p style="margin: auto 18px 16px; font-size: 12px; color: #555A6E">Used 3 times. Edits only change this saved copy.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>

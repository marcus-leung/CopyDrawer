<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Folders side panel, compact</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2457C5}a:hover{color:#173D8F}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 400px; height: 860px; box-sizing: border-box; background: #FFFFFF; color: #1B1D2A; font-family: 'Instrument Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 14px 14px 10px; display: flex; align-items: center; gap: 8px">
    <label for="search-cc" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search your clips</label>
    <div style="flex: 1; display: flex; align-items: center; gap: 8px; background: #F1F2F6; border-radius: 22px; padding: 0 14px; height: 44px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#555A6E" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <input id="search-cc" type="search" placeholder="Search or describe a clip" style="flex: 1; border: 0; outline: none; font: inherit; font-size: 14px; color: #1B1D2A; background: transparent; min-width: 0">
    </div>
    <button aria-label="Settings" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #F1F2F6; color: #1B1D2A; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="19" cy="12" r="1.5"></circle></svg></button>
  </header>

  <nav aria-label="Smart collections" style="padding: 0 14px 12px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
    <a href="#" style="text-decoration: none; color: #1B1D2A; background: #E6EEFC; border-top: 3px solid #2457C5; border-radius: 4px 4px 10px 10px; padding: 8px 8px 7px; display: flex; flex-direction: column"><span style="font-weight: 600; font-size: 13px">Research</span><span style="font-size: 12px; color: #3E4357">38</span></a>
    <a href="#" style="text-decoration: none; color: #1B1D2A; background: #FCEBD9; border-top: 3px solid #B35A00; border-radius: 4px 4px 10px 10px; padding: 8px 8px 7px; display: flex; flex-direction: column"><span style="font-weight: 600; font-size: 13px">Links</span><span style="font-size: 12px; color: #3E4357">51</span></a>
    <a href="#" style="text-decoration: none; color: #1B1D2A; background: #EEE8FB; border-top: 3px solid #6A46C9; border-radius: 4px 4px 10px 10px; padding: 8px 8px 7px; display: flex; flex-direction: column"><span style="font-weight: 600; font-size: 13px">Code</span><span style="font-size: 12px; color: #3E4357">12</span></a>
    <a href="#" style="text-decoration: none; color: #1B1D2A; background: #DDF3EC; border-top: 3px solid #0E7A62; border-radius: 4px 4px 10px 10px; padding: 8px 8px 7px; display: flex; flex-direction: column"><span style="font-weight: 600; font-size: 13px">Shopping</span><span style="font-size: 12px; color: #3E4357">9</span></a>
  </nav>

  <div style="padding: 0 14px 8px; display: flex; gap: 6px; flex-wrap: wrap">
    <button aria-pressed="true" style="height: 32px; padding: 0 12px; border: 0; border-radius: 16px; background: #1B1D2A; color: #FFFFFF; font-size: 12px; font-weight: 600; cursor: pointer">All</button>
    <button aria-pressed="false" style="height: 32px; padding: 0 12px; border: 1px solid #DADCE5; border-radius: 16px; background: #FFFFFF; color: #1B1D2A; font-size: 12px; font-weight: 600; cursor: pointer">Text</button>
    <button aria-pressed="false" style="height: 32px; padding: 0 12px; border: 1px solid #DADCE5; border-radius: 16px; background: #FFFFFF; color: #1B1D2A; font-size: 12px; font-weight: 600; cursor: pointer">Links</button>
    <button aria-pressed="false" style="height: 32px; padding: 0 12px; border: 1px solid #DADCE5; border-radius: 16px; background: #FFFFFF; color: #1B1D2A; font-size: 12px; font-weight: 600; cursor: pointer">Images</button>
    <button aria-pressed="false" style="height: 32px; padding: 0 12px; border: 1px solid #DADCE5; border-radius: 16px; background: #FFFFFF; color: #1B1D2A; font-size: 12px; font-weight: 600; cursor: pointer">Pinned</button>
  </div>

  <ul style="list-style: none; margin: 0; padding: 0 6px; flex: 1; overflow: hidden">
    <sc-for list="{{rows}}" as="row" hint-placeholder-count="12">
      <li style="display: flex; align-items: center; gap: 10px; padding: 0 8px; height: 50px; border-bottom: 1px solid #F0F1F5">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: {{row.color}}; flex-shrink: 0"></span>
        <span style="flex: 1; min-width: 0">
          <span style="display: block; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{row.title}}</span>
          <span style="display: block; font-size: 12px; color: #555A6E; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{row.meta}}</span>
        </span>
        <span style="font-size: 12px; color: #555A6E; flex-shrink: 0">{{row.time}}</span>
      </li>
    </sc-for>
  </ul>

  <footer style="padding: 8px 14px 12px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #ECEDF2">
    <span style="font-size: 12px; color: #3E4357">Private: stored and sorted on this device</span>
    <button style="height: 36px; padding: 0 12px; border: 1.5px solid #1B1D2A; border-radius: 18px; background: transparent; color: #1B1D2A; font-size: 12px; font-weight: 600; cursor: pointer">Pause</button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
  renderVals() {
    const B = '#2457C5', O = '#B35A00', V = '#6A46C9', T = '#0E7A62';
    return { rows: [
      { color: B, title: '“Green plants use sunlight to synthesize…”', meta: 'Research, wikipedia.org', time: '2m' },
      { color: O, title: 'Airbnb loft in Alfama, Lisbon', meta: 'Links, tracking removed', time: '1h' },
      { color: T, title: 'Trail running shoes, size 10', meta: 'Shopping, rei.com', time: '3h' },
      { color: V, title: 'SQL join on orders', meta: 'Code, github.com', time: '5h' },
      { color: B, title: 'Mitochondria: the powerhouse of the cell', meta: 'Research, khanacademy.org', time: 'Yesterday' },
      { color: O, title: 'Zoom link for study group', meta: 'Links, mail.google.com', time: 'Yesterday' },
      { color: V, title: 'npm install @fontsource/instrument-sans', meta: 'Code, fontsource.org', time: 'Mon' },
      { color: B, title: 'APA citation format example', meta: 'Research, owl.purdue.edu', time: 'Mon' },
      { color: T, title: 'Desk lamp, warm white', meta: 'Shopping, ikea.com', time: 'Sun' },
      { color: O, title: 'Lecture recording, week 6', meta: 'Links, canvas.edu', time: 'Sun' },
      { color: B, title: '“The French Revolution began in 1789…”', meta: 'Research, britannica.com', time: 'Sat' },
      { color: V, title: 'git rebase -i HEAD~3', meta: 'Code, stackoverflow.com', time: 'Sat' }
    ] };
  }
}
</script>
</body>
</html>

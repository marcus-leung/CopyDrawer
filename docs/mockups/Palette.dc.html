<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quick-paste box over a web page</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 720px; height: 460px; box-sizing: border-box; position: relative; overflow: hidden; background: #F4F5F7; font-family: 'Instrument Sans', sans-serif; color: #1B1D2A">
  <div aria-hidden="true" style="padding: 28px 40px; display: flex; flex-direction: column; gap: 14px; opacity: 0.55">
    <div style="font-size: 20px; font-weight: 600; color: #3E4357">[Any website: a form]</div>
    <div style="height: 40px; border-radius: 8px; background: #FFFFFF; border: 1px solid #D5D8E0"></div>
    <div style="height: 40px; border-radius: 8px; background: #FFFFFF; border: 2px solid #2457C5"></div>
    <div style="height: 120px; border-radius: 8px; background: #FFFFFF; border: 1px solid #D5D8E0"></div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(27,29,42,0.25)"></div>

  <section aria-label="Quick paste" style="position: absolute; left: 120px; top: 56px; width: 480px; background: #FFFFFF; border-radius: 18px; box-shadow: 0 20px 48px rgba(27,29,42,0.28); overflow: hidden">
    <div style="padding: 12px; border-bottom: 1px solid #ECEDF2">
      <label for="palette-q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Filter clips</label>
      <input id="palette-q" type="text" value="addr" style="width: 100%; box-sizing: border-box; height: 44px; border: 0; border-radius: 12px; background: #F1F2F6; padding: 0 14px; font: inherit; font-size: 15px; color: #1B1D2A; outline: none">
    </div>
    <ul style="list-style: none; margin: 0; padding: 6px">
      <li style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; background: #E6EEFC">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #5B6170"></span>
        <span style="flex: 1; min-width: 0"><span style="display: block; font-size: 14px; font-weight: 600">Home address</span><span style="display: block; font-size: 12px; color: #3E4357">[Street], [City], [Postcode]</span></span>
        <kbd style="font-family: inherit; font-size: 11px; font-weight: 600; padding: 2px 6px; border: 1px solid #B7C6EA; border-radius: 6px; color: #173D8F">Enter</kbd>
      </li>
      <li style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #5B6170"></span>
        <span style="flex: 1; min-width: 0"><span style="display: block; font-size: 14px; font-weight: 600">Work address</span><span style="display: block; font-size: 12px; color: #555A6E">[Office street], [City]</span></span>
      </li>
      <li style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #B35A00"></span>
        <span style="flex: 1; min-width: 0"><span style="display: block; font-size: 14px; font-weight: 600">Email address for invoices</span><span style="display: block; font-size: 12px; color: #555A6E">[name]@[company].com</span></span>
      </li>
    </ul>
    <div style="padding: 10px 16px; border-top: 1px solid #ECEDF2; display: flex; gap: 16px; font-size: 12px; color: #3E4357">
      <span><kbd style="font-family: inherit; font-weight: 600; padding: 2px 6px; border: 1px solid #DADCE5; border-radius: 6px">Enter</kbd> paste</span>
      <span><kbd style="font-family: inherit; font-weight: 600; padding: 2px 6px; border: 1px solid #DADCE5; border-radius: 6px">Tab</kbd> paste as</span>
      <span><kbd style="font-family: inherit; font-weight: 600; padding: 2px 6px; border: 1px solid #DADCE5; border-radius: 6px">Esc</kbd> close</span>
      <span style="margin-left: auto">Opened with <kbd style="font-family: inherit; font-weight: 600; padding: 2px 6px; border: 1px solid #DADCE5; border-radius: 6px">Alt+Shift+V</kbd></span>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":460}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>

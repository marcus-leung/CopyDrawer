<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Image saved confirmation on the page</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 720px; height: 460px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'Instrument Sans', sans-serif; color: #1B1D2A">
  <div aria-hidden="true" style="padding: 28px 40px">
    <div style="font-size: 20px; font-weight: 600; color: #3E4357">[Any website: an article]</div>
    <div style="margin-top: 12px; height: 10px; width: 520px; border-radius: 5px; background: #ECEDF2"></div>
    <div style="margin-top: 8px; height: 10px; width: 460px; border-radius: 5px; background: #ECEDF2"></div>
    <div style="margin-top: 20px; width: 360px; height: 230px; border-radius: 10px; background: repeating-linear-gradient(135deg, #F1F2F6 0 12px, #E5E7EE 12px 24px); display: flex; align-items: center; justify-content: center; font-size: 13px; color: #555A6E">[Image: Calvin cycle diagram]</div>
  </div>

  <div style="position: absolute; right: 24px; bottom: 24px; width: 320px; background: #FFFFFF; border-radius: 18px; box-shadow: 0 14px 36px rgba(27,29,42,0.24), 0 0 0 1px rgba(27,29,42,0.06); padding: 12px; display: flex; gap: 12px; align-items: center">
    <div style="width: 64px; height: 48px; border-radius: 10px; background: repeating-linear-gradient(135deg, #F1F2F6 0 8px, #E5E7EE 8px 16px); flex-shrink: 0; position: relative">
      <span style="position: absolute; right: -6px; bottom: -6px; width: 22px; height: 22px; border-radius: 11px; background: #0E7A62; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg></span>
    </div>
    <div style="flex: 1; min-width: 0">
      <p style="margin: 0; font-size: 14px; font-weight: 600">Image saved</p>
      <p style="margin: 2px 0 0; font-size: 13px; color: #3E4357; display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #2457C5"></span>Filed in Research</p>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <button style="height: 30px; padding: 0 10px; border: 0; border-radius: 15px; background: #F1F2F6; color: #1B1D2A; font-size: 12px; font-weight: 600; cursor: pointer">Open</button>
      <button style="height: 30px; padding: 0 10px; border: 0; border-radius: 15px; background: transparent; color: #1B1D2A; font-size: 12px; font-weight: 600; cursor: pointer; text-decoration: underline">Undo</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":460}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Toolbar popup</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 360px; height: 560px; box-sizing: border-box; background: #FFFFFF; color: #1B1D2A; font-family: 'Instrument Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 14px 16px 10px; display: flex; align-items: center; justify-content: space-between">
    <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 18px">Recent clips</span>
    <button style="height: 36px; padding: 0 12px; border: 0; border-radius: 18px; background: #F1F2F6; color: #1B1D2A; font-size: 12px; font-weight: 600; cursor: pointer">Open panel</button>
  </header>
  <ul style="list-style: none; margin: 0; padding: 0 8px; flex: 1; overflow: hidden">
    <sc-for list="{{rows}}" as="row" hint-placeholder-count="8">
      <li>
        <button style="width: 100%; display: flex; align-items: center; gap: 10px; padding: 0 8px; height: 48px; border: 0; border-radius: 10px; background: transparent; text-align: left; cursor: pointer; color: #1B1D2A">
          <span style="width: 8px; height: 8px; border-radius: 50%; background: {{row.color}}; flex-shrink: 0"></span>
          <span style="flex: 1; min-width: 0; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{row.title}}</span>
          <span style="font-size: 12px; color: #555A6E">{{row.time}}</span>
        </button>
      </li>
    </sc-for>
  </ul>
  <footer style="padding: 10px 16px 12px; border-top: 1px solid #ECEDF2; display: flex; align-items: center; justify-content: space-between">
    <span style="font-size: 12px; color: #3E4357">Click a clip to copy it</span>
    <label style="display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600">Auto-save
      <input type="checkbox" role="switch" checked style="width: 20px; height: 20px; accent-color: #1B1D2A">
    </label>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    const B = '#2457C5', O = '#B35A00', V = '#6A46C9', T = '#0E7A62';
    return { rows: [
      { color: B, title: '“Green plants use sunlight to synthesize…”', time: '2m' },
      { color: B, title: '[Image] Calvin cycle diagram', time: '5m' },
      { color: O, title: 'Airbnb loft in Alfama, Lisbon', time: '1h' },
      { color: T, title: '1Z 999 AA1 01 2345 6784', time: '3h' },
      { color: V, title: 'SQL join on orders', time: '5h' },
      { color: O, title: 'Zoom link for study group', time: 'Yesterday' },
      { color: B, title: 'APA citation format example', time: 'Mon' },
      { color: T, title: 'Desk lamp, warm white', time: 'Sun' }
    ] };
  }
}
</script>
</body>
</html>

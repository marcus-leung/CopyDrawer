<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Screenshot an area of the page</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 720px; height: 460px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'Instrument Sans', sans-serif; color: #1B1D2A">
  <div aria-hidden="true" style="padding: 28px 40px">
    <div style="font-size: 20px; font-weight: 600; color: #3E4357">[Any website: a lecture slide]</div>
    <div style="margin-top: 16px; display: flex; gap: 16px">
      <div style="width: 300px; height: 200px; border-radius: 10px; background: repeating-linear-gradient(135deg, #F1F2F6 0 12px, #E5E7EE 12px 24px)"></div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 10px; padding-top: 8px">
        <div style="height: 10px; width: 90%; border-radius: 5px; background: #ECEDF2"></div>
        <div style="height: 10px; width: 75%; border-radius: 5px; background: #ECEDF2"></div>
        <div style="height: 10px; width: 82%; border-radius: 5px; background: #ECEDF2"></div>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 0; top: 0; width: 720px; height: 76px; background: rgba(27,29,42,0.45)"></div>
  <div style="position: absolute; left: 0; top: 76px; width: 32px; height: 236px; background: rgba(27,29,42,0.45)"></div>
  <div style="position: absolute; left: 352px; top: 76px; width: 368px; height: 236px; background: rgba(27,29,42,0.45)"></div>
  <div style="position: absolute; left: 0; top: 312px; width: 720px; height: 148px; background: rgba(27,29,42,0.45)"></div>

  <div style="position: absolute; left: 32px; top: 76px; width: 320px; height: 236px; box-sizing: border-box; border: 2px solid #FFFFFF; box-shadow: 0 0 0 1px #2457C5">
    <span style="position: absolute; left: -6px; top: -6px; width: 10px; height: 10px; background: #FFFFFF; border: 2px solid #2457C5; border-radius: 3px"></span>
    <span style="position: absolute; right: -6px; top: -6px; width: 10px; height: 10px; background: #FFFFFF; border: 2px solid #2457C5; border-radius: 3px"></span>
    <span style="position: absolute; left: -6px; bottom: -6px; width: 10px; height: 10px; background: #FFFFFF; border: 2px solid #2457C5; border-radius: 3px"></span>
    <span style="position: absolute; right: -6px; bottom: -6px; width: 10px; height: 10px; background: #FFFFFF; border: 2px solid #2457C5; border-radius: 3px"></span>
    <span style="position: absolute; right: 6px; bottom: 6px; padding: 2px 8px; border-radius: 6px; background: #1B1D2A; color: #FFFFFF; font-size: 12px; font-weight: 600">320 × 236</span>
  </div>

  <div style="position: absolute; left: 50%; top: 16px; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; padding: 6px 6px 6px 16px; border-radius: 24px; background: #FFFFFF; box-shadow: 0 8px 24px rgba(27,29,42,0.25); white-space: nowrap">
    <span style="font-size: 13px">Drag to choose an area</span>
    <button style="height: 36px; padding: 0 14px; border: 0; border-radius: 18px; background: #F1F2F6; color: #1B1D2A; font-size: 13px; font-weight: 600; cursor: pointer">Cancel</button>
    <button style="height: 36px; padding: 0 14px; border: 0; border-radius: 18px; background: #1B1D2A; color: #FFFFFF; font-size: 13px; font-weight: 600; cursor: pointer">Save screenshot</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":460}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>

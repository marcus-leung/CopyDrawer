<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2457C5}a:hover{color:#173D8F}
button,select{font-family:inherit}
</style>
</helmet>
<div style="width: 400px; height: 860px; box-sizing: border-box; background: #FFFFFF; color: #1B1D2A; font-family: 'Instrument Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 14px 14px 8px; display: flex; align-items: center; gap: 6px">
    <button aria-label="Back to home" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; color: #1B1D2A; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px">Settings</h1>
  </header>

  <div style="flex: 1; overflow: hidden; padding: 0 18px; display: flex; flex-direction: column; gap: 18px">
    <section aria-labelledby="s-cap">
      <h2 id="s-cap" style="margin: 0 0 6px; font-size: 13px; font-weight: 600; color: #555A6E">Saving</h2>
      <div style="display: flex; align-items: center; justify-content: space-between; min-height: 44px">
        <label for="t-auto" style="font-size: 14px; font-weight: 600">Save what I copy automatically</label>
        <input id="t-auto" type="checkbox" role="switch" checked style="width: 22px; height: 22px; accent-color: #1B1D2A">
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; min-height: 44px">
        <span style="font-size: 14px">Sites I've blocked</span>
        <a href="#" style="font-size: 14px; font-weight: 600">3 sites</a>
      </div>
    </section>

    <section aria-labelledby="s-key">
      <h2 id="s-key" style="margin: 0 0 6px; font-size: 13px; font-weight: 600; color: #555A6E">Shortcuts</h2>
      <div style="display: flex; align-items: center; justify-content: space-between; min-height: 44px">
        <span style="font-size: 14px">Quick paste</span>
        <kbd style="font-family: inherit; font-size: 13px; font-weight: 600; padding: 4px 8px; border: 1px solid #DADCE5; border-radius: 8px">Alt+Shift+V</kbd>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; min-height: 44px">
        <span style="font-size: 14px">Save selection</span>
        <kbd style="font-family: inherit; font-size: 13px; font-weight: 600; padding: 4px 8px; border: 1px solid #DADCE5; border-radius: 8px">Alt+Shift+S</kbd>
      </div>
      <a href="#" style="font-size: 13px; font-weight: 600">Change shortcuts in Chrome</a>
    </section>

    <section aria-labelledby="s-hist">
      <h2 id="s-hist" style="margin: 0 0 6px; font-size: 13px; font-weight: 600; color: #555A6E">History</h2>
      <div style="font-size: 14px; display: flex; justify-content: space-between"><span>Clips saved</span><span style="font-weight: 600">214 of 2,000</span></div>
      <div style="height: 6px; border-radius: 3px; background: #ECEDF2; margin-top: 8px"><div style="width: 11%; height: 6px; border-radius: 3px; background: #2457C5"></div></div>
      <div style="display: flex; align-items: center; justify-content: space-between; min-height: 44px; margin-top: 6px">
        <label for="s-del" style="font-size: 14px">Delete old clips</label>
        <select id="s-del" style="height: 36px; border: 1px solid #DADCE5; border-radius: 8px; font-size: 13px; padding: 0 8px; background: #FFFFFF; color: #1B1D2A">
          <option>Never</option><option>After 30 days</option><option>After 90 days</option>
        </select>
      </div>
    </section>

    <section aria-labelledby="s-ai">
      <h2 id="s-ai" style="margin: 0 0 6px; font-size: 13px; font-weight: 600; color: #555A6E">AI on this device</h2>
      <div style="padding: 12px 14px; border-radius: 14px; background: #DDF3EC">
        <p style="margin: 0; font-size: 14px; font-weight: 600; color: #0B5C4A">Full AI is ready</p>
        <p style="margin: 4px 0 0; font-size: 13px; line-height: 19px; color: #1E4A40">Sorting, search, rewriting and summaries all run on this computer.</p>
      </div>
    </section>

    <section aria-labelledby="s-priv">
      <h2 id="s-priv" style="margin: 0 0 6px; font-size: 13px; font-weight: 600; color: #555A6E">Privacy and data</h2>
      <div style="display: flex; align-items: center; justify-content: space-between; min-height: 44px; gap: 12px">
        <label for="t-usage" style="font-size: 14px">Share anonymous usage counts<span style="display: block; font-size: 12px; color: #555A6E">Never your clips or the sites you visit</span></label>
        <input id="t-usage" type="checkbox" role="switch" checked style="width: 22px; height: 22px; accent-color: #1B1D2A; flex-shrink: 0">
      </div>
      <div style="display: flex; gap: 8px; margin-top: 8px">
        <button style="flex: 1; height: 42px; border: 0; border-radius: 21px; background: #F1F2F6; color: #1B1D2A; font-size: 13px; font-weight: 600; cursor: pointer">Export</button>
        <button style="flex: 1; height: 42px; border: 0; border-radius: 21px; background: #F1F2F6; color: #1B1D2A; font-size: 13px; font-weight: 600; cursor: pointer">Import</button>
        <button style="flex: 1; height: 42px; border: 1.5px solid #B42318; border-radius: 21px; background: #FFFFFF; color: #B42318; font-size: 13px; font-weight: 600; cursor: pointer">Delete all</button>
      </div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>

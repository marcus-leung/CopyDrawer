<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dates and places in a clip</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5E5100}a:hover{color:#4D4200}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 400px; height: 860px; box-sizing: border-box; background: #FFFFFF; color: #1B1D2A; font-family: 'Instrument Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 14px 14px 8px">
    <button aria-label="Back" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; color: #1B1D2A; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
  </header>

  <div style="padding: 0 18px">
    <p style="margin: 0; font-size: 13px; font-weight: 600; color: #5E5100; display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #7C6A0A"></span>Lisbon trip</p>
    <h1 style="margin: 6px 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px">Fado show</h1>
    <p style="margin: 14px 0 0; padding: 14px; border-radius: 14px; background: #F1F2F6; font-size: 15px; line-height: 23px">“Fado on <b>Sat 18 Oct, 9 PM</b> at <b>Rua de São João da Praça 94, Lisbon</b>. Tickets €35 each, dinner included.”</p>
  </div>

  <div style="padding: 16px 18px 0; display: flex; flex-direction: column; gap: 8px">
    <button style="height: 52px; border: 0; border-radius: 26px; background: #F6F0D5; color: #4D4200; font-size: 15px; font-weight: 600; cursor: pointer">Add Sat 18 Oct, 9 PM to calendar</button>
    <a href="#" style="height: 52px; border-radius: 26px; background: #F6F0D5; color: #4D4200; font-size: 15px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Open address in Maps</a>
  </div>

  <div style="margin-top: auto; padding: 0 18px 18px">
    <button style="width: 100%; height: 52px; border: 0; border-radius: 26px; background: #1B1D2A; color: #FFFFFF; font-size: 15px; font-weight: 600; cursor: pointer">Paste</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
